name: Coronalis
version: ${project.version}
main: com.github.jackstar.coronalis.Coronalis
api-version: '1.21'
description: Addon Slimefun Coronalis — array de radio, correlación de fase y catálogo de descubrimientos con XP.
depend:
  - Slimefun
author: JackStar6677-1
website: https://github.com/JackStar6677-1/Coronalis
commands:
  coronalis:
    description: Terminal, guías y smoke test de Coronalis.
    usage: /coronalis <help|guide|items|smoke|status|telemetry|compare|move|reset|tune|step|scan|dashboard|maintenance|export|programs|program|auth>
    aliases: [cor]
permissions:
  coronalis.admin:
    description: Permite administrar consolas y ejecutar smoke tests de Coronalis.
    default: op
