<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="100%" role="img" aria-labelledby="title desc">
  <title id="title">Coronalis Array Labs</title>
  <desc id="desc">Banner del addon Coronalis con red de radiotelescopios, consola, telemetría, energía y señales de radio.</desc>
  <defs>
    <radialGradient id="sky" cx="62%" cy="22%" r="92%">
      <stop offset="0%" stop-color="#14334b"/>
      <stop offset="38%" stop-color="#101a31"/>
      <stop offset="72%" stop-color="#070b17"/>
      <stop offset="100%" stop-color="#02030a"/>
    </radialGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff4b8"/>
      <stop offset="45%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity=".42"/>
      <stop offset="55%" stop-color="#f59e0b" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#fff7ed" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .label{font:700 13px 'Segoe UI',Arial,sans-serif;letter-spacing:5px;fill:#38bdf8}
      .title{font:900 68px 'Segoe UI',Arial,sans-serif;letter-spacing:-2px;fill:url(#sun);filter:url(#softGlow)}
      .sub{font:500 18px 'Segoe UI',Arial,sans-serif;fill:#dbeafe}
      .mono{font:600 12px Consolas,monospace;fill:#86efac}
      .dim{font:500 11px Consolas,monospace;fill:#8aa4c8}
      .tw{animation:twinkle 3s ease-in-out infinite}
      .tw2{animation:twinkle 4.7s ease-in-out infinite .7s}
      .flow{stroke-dasharray:8 10;animation:dash 7s linear infinite}
      .ring{animation:ring 3.8s ease-out infinite}
      .sweep{animation:sweep 5s linear infinite;transform-origin:180px 214px}
      .dish{animation:tilt 6s ease-in-out infinite;transform-origin:center bottom}
      .bars rect{animation:bars 1.6s ease-in-out infinite}
      .bars rect:nth-child(2){animation-delay:.2s}.bars rect:nth-child(3){animation-delay:.4s}.bars rect:nth-child(4){animation-delay:.6s}
      @keyframes twinkle{0%,100%{opacity:.28}50%{opacity:1}}
      @keyframes dash{to{stroke-dashoffset:-80}}
      @keyframes ring{0%{r:8;opacity:.85}100%{r:132;opacity:0}}
      @keyframes sweep{to{transform:rotate(360deg)}}
      @keyframes tilt{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(2deg)}}
      @keyframes bars{0%,100%{height:12px;y:24px}50%{height:32px;y:4px}}
    </style>
  </defs>

  <rect width="1280" height="420" fill="url(#sky)"/>
  <path d="M0 330 C160 285 280 360 430 318 C610 266 725 300 880 250 C1045 197 1130 236 1280 184 L1280 420 L0 420 Z" fill="#07111f"/>
  <path d="M0 365 C220 318 360 386 575 340 C760 300 940 340 1280 280 L1280 420 L0 420 Z" fill="#050a14"/>

  <g opacity=".65">
    <circle cx="74" cy="54" r="1.2" fill="#ffffff" class="tw"/>
    <circle cx="254" cy="86" r="1" fill="#bae6fd" class="tw2"/>
    <circle cx="500" cy="38" r="1.5" fill="#fde68a" class="tw"/>
    <circle cx="770" cy="74" r="1" fill="#ffffff" class="tw2"/>
    <circle cx="1022" cy="44" r="1.7" fill="#bae6fd" class="tw"/>
    <circle cx="1180" cy="112" r="1.2" fill="#fde68a" class="tw2"/>
    <circle cx="1160" cy="335" r="1" fill="#ffffff" class="tw"/>
  </g>

  <g stroke="#38bdf8" stroke-opacity=".12" stroke-width="1">
    <path d="M455 60 H1195"/>
    <path d="M455 120 H1195"/>
    <path d="M455 180 H1195"/>
    <path d="M455 240 H1195"/>
    <path d="M520 32 V335"/>
    <path d="M660 32 V335"/>
    <path d="M800 32 V335"/>
    <path d="M940 32 V335"/>
    <path d="M1080 32 V335"/>
  </g>

  <g>
    <circle cx="180" cy="214" r="132" fill="#06251e" fill-opacity=".45" stroke="#22c55e" stroke-opacity=".35"/>
    <circle cx="180" cy="214" r="94" fill="none" stroke="#22c55e" stroke-opacity=".18"/>
    <circle cx="180" cy="214" r="52" fill="none" stroke="#22c55e" stroke-opacity=".18"/>
    <path class="sweep" d="M180 214 L180 82 A132 132 0 0 1 312 214 Z" fill="url(#green)" opacity=".28"/>
    <line x1="180" y1="82" x2="180" y2="346" stroke="#22c55e" stroke-opacity=".15"/>
    <line x1="48" y1="214" x2="312" y2="214" stroke="#22c55e" stroke-opacity=".15"/>
    <circle cx="222" cy="176" r="5" fill="#86efac" filter="url(#softGlow)" class="tw"/>
    <circle cx="136" cy="252" r="4" fill="#38bdf8" filter="url(#softGlow)" class="tw2"/>
    <circle cx="246" cy="264" r="3" fill="#f59e0b" filter="url(#softGlow)" class="tw"/>
    <text x="180" y="366" text-anchor="middle" class="mono">NETWORK SCAN · 50 NODE CAP</text>
  </g>

  <g transform="translate(360 218)">
    <circle class="ring" cx="0" cy="0" r="8" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
    <circle class="ring" cx="0" cy="0" r="8" fill="none" stroke="#f59e0b" stroke-width="1.1" style="animation-delay:1.2s"/>
    <circle class="ring" cx="0" cy="0" r="8" fill="none" stroke="#86efac" stroke-width=".9" style="animation-delay:2.4s"/>
  </g>

  <path class="flow" d="M318 260 C475 205 610 232 760 292 C890 344 1010 320 1192 250" fill="none" stroke="url(#cyan)" stroke-width="2.4" opacity=".62"/>
  <path class="flow" d="M308 302 C465 342 640 314 802 250 C925 202 1050 214 1210 170" fill="none" stroke="url(#sun)" stroke-width="1.5" opacity=".42" style="animation-duration:9s"/>

  <g transform="translate(866 54)">
    <path d="M180 248 L42 34 L0 34 L138 248 Z" fill="url(#beam)"/>
  </g>

  <g transform="translate(980 202)" class="dish">
    <path d="M66 116 L44 42 H88 L66 116 Z" fill="#111827" stroke="#f59e0b" stroke-width="1.4"/>
    <rect x="58" y="42" width="16" height="24" rx="3" fill="url(#sun)"/>
    <path d="M0 22 Q66 76 132 22 C112 -12 20 -12 0 22 Z" fill="url(#sun)" filter="url(#softGlow)"/>
    <path d="M0 22 L66 -26 L132 22" fill="none" stroke="#fde68a" stroke-width="1.5"/>
    <circle cx="66" cy="-26" r="7" fill="#38bdf8" filter="url(#softGlow)"/>
  </g>

  <g transform="translate(720 286) scale(.56)" opacity=".92">
    <path d="M0 18 Q58 58 116 18 C96 -6 20 -6 0 18 Z" fill="#27324a" stroke="#38bdf8" stroke-width="2"/>
    <line x1="58" y1="18" x2="58" y2="72" stroke="#38bdf8" stroke-width="3"/>
    <circle cx="58" cy="18" r="5" fill="#86efac"/>
  </g>
  <g transform="translate(812 318) scale(.45)" opacity=".82">
    <path d="M0 18 Q58 58 116 18 C96 -6 20 -6 0 18 Z" fill="#27324a" stroke="#f59e0b" stroke-width="2"/>
    <line x1="58" y1="18" x2="58" y2="72" stroke="#f59e0b" stroke-width="3"/>
  </g>

  <g transform="translate(930 296)">
    <rect x="0" y="0" width="126" height="54" rx="10" fill="#08111f" stroke="#38bdf8" stroke-opacity=".4"/>
    <text x="12" y="18" class="dim">SU BUFFER</text>
    <text x="12" y="38" class="mono">4J=1SU · 8192J</text>
    <g class="bars" transform="translate(86 10)" fill="#22c55e">
      <rect x="0" y="24" width="6" height="12" rx="2"/>
      <rect x="10" y="16" width="6" height="20" rx="2"/>
      <rect x="20" y="8" width="6" height="28" rx="2"/>
      <rect x="30" y="20" width="6" height="16" rx="2"/>
    </g>
  </g>

  <g transform="translate(392 48)">
    <rect width="505" height="205" rx="22" fill="#050816" fill-opacity=".86" stroke="#f59e0b" stroke-opacity=".3"/>
    <text x="30" y="40" class="label">CORONALIS ARRAY LABS</text>
    <text x="28" y="106" class="title">Coronalis</text>
    <text x="31" y="138" class="sub">Slimefun · radioastronomía · telemetría · XP</text>
    <text x="32" y="168" class="mono">CABLE NETWORK · ENERGYNET · PROGRAMS · SMOKE TEST</text>
    <text x="32" y="192" class="dim">JackStar6677 · Paper 1.21.1 · Java 21</text>
  </g>

  <g transform="translate(1138 82)" filter="url(#bigGlow)">
    <circle cx="0" cy="0" r="22" fill="#f59e0b" opacity=".9"/>
    <circle cx="0" cy="0" r="42" fill="#f59e0b" opacity=".08"/>
  </g>
</svg>
